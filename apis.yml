aid: smartthings
url: https://raw.githubusercontent.com/api-evangelist/smartthings/refs/heads/main/apis.yml
name: Samsung SmartThings
kind: company
description: Samsung SmartThings is a smart-home IoT platform for connecting,
  controlling, and automating devices across a home. The SmartThings API is a
  RESTful interface (base https://api.smartthings.com/v1) that lets integrations
  control devices, read device status, manage locations, rooms, and modes, build
  automations with Rules and Scenes, define and inspect capabilities, and build
  SmartApps that subscribe to events and run schedules. Authentication is via a
  Personal Access Token (PAT) for testing or OAuth 2.0 for production
  integrations. SmartThings publishes a real OpenAPI/Swagger definition at
  swagger.api.smartthings.com/public/st-api.yml. Event delivery is push-based
  over HTTP webhooks (SmartApp lifecycle callbacks and the Enterprise Eventing
  API sinks/subscriptions), not a public WebSocket.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
