meters:
- name: api_requests
  description: Public REST API requests, free but bounded by per-token/per-app rate limits.
  unit: requests
  aggregation: sum
  dimensions:
  - principal
  - installedApp
  - device
- name: lambda_invocations
  description: AWS Lambda invocations for a LAMBDA_SMART_APP handling lifecycle and EVENT callbacks (billed by AWS, not SmartThings).
  unit: invocations
  aggregation: sum
  dimensions:
  - installedApp
- name: webhook_compute
  description: Compute and bandwidth for a WEBHOOK_SMART_APP endpoint receiving callbacks (billed by your host, not SmartThings).
  unit: hours
  aggregation: sum
  dimensions:
  - installedApp
- name: events_delivered
  description: Subscription/eventing volume delivered to your SmartApp; drives downstream compute cost.
  unit: events
  aggregation: sum
  dimensions:
  - installedApp
  - subscription
principles:
- name: Visibility
  description: Track API request volume against X-RateLimit headers and monitor Lambda/webhook cost per installed app.
- name: Allocation
  description: Map SmartApp installations and subscriptions to workloads/teams so downstream compute cost is attributable.
- name: Optimization
  description: Scope subscriptions to only the devices and capabilities you need, batch device commands (up to 10 per request) and events (up to 50 per request), and stay within rate limits to avoid retries.
- name: Accountability
  description: Assign owners per SmartApp; review Lambda/webhook spend and 429/422 rates monthly.
