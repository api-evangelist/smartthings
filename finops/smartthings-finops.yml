description: >-
  FinOps view of building on SmartThings. The SmartThings public REST API is
  free to use, so there is no direct per-call SmartThings invoice for a typical
  integration. The relevant cost is instead your own infrastructure for the
  SmartApp side of the integration - for a WEBHOOK_SMART_APP, the compute and
  bandwidth of the HTTPS endpoint that receives lifecycle and EVENT callbacks;
  for a LAMBDA_SMART_APP, the AWS Lambda invocations, duration, and associated
  API Gateway/CloudWatch charges. SmartThings' own governance cost is
  operational: staying within per-token and per-app rate limits and guardrails
  to avoid 429/422 errors and degraded event delivery. Large-scale integrations
  route through the Enterprise API / service-account program with its own
  contract terms.
notes: >-
  There is no published per-call price for the SmartThings public API. Dominant
  costs are the developer's own SmartApp hosting (Lambda or webhook) and the
  operational discipline of honoring rate limits. Verify Enterprise program
  terms with SmartThings.
