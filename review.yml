sources:
  - url: https://developer.smartthings.com/docs/api/public
    type: APIReference
    note: Public API reference. Base https://api.smartthings.com/v1; all REST. No WebSocket.
  - url: https://swagger.api.smartthings.com/public/st-api.yml
    type: OpenAPI
    note: Official Swagger/OpenAPI definition of the public API. Source of the confirmed endpoint list.
  - url: https://developer.smartthings.com/docs/getting-started/quickstart
    type: Documentation
    note: Confirms base URL, PAT auth, and OAuth 2.0 /oauth/authorize and /oauth/token endpoints.
  - url: https://developer.smartthings.com/docs/getting-started/rate-limits
    type: Documentation
    note: Per-endpoint rate limits and guardrails; X-RateLimit-* headers; 429 (rate limit) and 422 (guardrail).
  - url: https://developer.smartthings.com/docs/connected-services/lifecycles
    type: Documentation
    note: SmartApp lifecycle (PING, CONFIGURATION, INSTALL, UPDATE, EVENT, UNINSTALL). Events delivered via EVENT webhook callback.
  - url: https://developer.smartthings.com/docs/enterprise/enterprise-api-overview/eventing/overview
    type: Documentation
    note: Enterprise Eventing API - account-level webhook sinks + subscriptions. HTTP webhook delivery, not WebSocket.
  - url: https://github.com/SmartThingsCommunity/smartthings-core-sdk
    type: SourceCode
    note: Open-source Node SDK enumerating resource groups (Devices, Locations, Rooms, Scenes, Rules, Apps, InstalledApps, Subscriptions, Schedules, Capabilities, Presentation, History, Virtual Devices, etc).
  - url: https://github.com/401Unauthorized/smart-events
    type: SourceCode
    note: Unofficial, alpha, non-production community WebSocket library using undocumented endpoints. Not part of the documented public API.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No documented public WebSocket surface exists, and SmartThings' own API is
    request/response REST. Its eventing is outbound HTTP webhooks (SmartApp
    EVENT callbacks and Enterprise Eventing sinks) delivered to
    developer-hosted endpoints, so there is no server-push channel on
    SmartThings' own API to model as AsyncAPI. No AsyncAPI document was created.
