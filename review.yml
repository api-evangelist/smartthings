aid: smartthings
name: Samsung SmartThings
review:
  question: Does SmartThings expose a documented public WebSocket API?
  answer: false
  date: '2026-07-03'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. SmartThings' documented public API is a
    request/response REST API (base https://api.smartthings.com/v1). Its
    server-push / eventing surface is not a WebSocket and not an HTTP SSE stream
    either - events are delivered outbound as HTTP webhook callbacks to a
    developer-hosted endpoint (a SmartApp's EVENT lifecycle callback, or the
    Enterprise Eventing API's account-level "sinks"). There is no server-push
    channel on SmartThings' own API endpoint to model as AsyncAPI; the transport
    that carries events is the developer's own webhook receiver.
findings:
  summary: |
    SmartThings does not publish a documented public WebSocket API. The
    SmartThings platform exposes a RESTful HTTPS API at
    https://api.smartthings.com/v1, authenticated with a Personal Access Token
    (PAT) for testing or OAuth 2.0 for production, and passed as
    `Authorization: Bearer {token}`. It publishes a real OpenAPI/Swagger
    definition at https://swagger.api.smartthings.com/public/st-api.yml.
    Real-time device events are delivered push-style over HTTP webhooks, not
    WebSocket: a SmartApp (a registered WEBHOOK_SMART_APP or LAMBDA_SMART_APP)
    creates Subscriptions and then receives matching events via the EVENT
    lifecycle callback POSTed to its endpoint, and the Enterprise Eventing API
    lets service accounts register account-level webhook "sinks" with
    subscriptions. An unofficial community WebSocket library (smart-events)
    exists that uses undocumented endpoints, but it is explicitly not
    production-ready and is not part of the documented public API. No official
    ws:// or wss:// endpoint is documented.
  openSource: |
    SmartThings itself is a proprietary Samsung platform, but the developer
    tooling and SDKs are open source under the SmartThingsCommunity GitHub
    organization (github.com/SmartThingsCommunity) - including the CLI, the
    core Node.js SDK (smartthings-core-sdk), Edge device drivers, and SmartApp
    SDKs. The API itself is grounded in a published Swagger/OpenAPI definition.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.smartthings.com/v1
      documented: true
      note: The core public API - devices, commands/status, locations, rooms, modes, scenes, rules, capabilities, apps, installed apps, subscriptions, schedules, presentations.
    - protocol: OAuth
      scheme: https
      baseURL: https://api.smartthings.com/oauth
      documented: true
      note: OAuth 2.0 authorization code flow (/oauth/authorize, /oauth/token) for production integrations. PAT available for testing.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Primary eventing transport. SmartApp EVENT lifecycle callbacks and Enterprise Eventing API "sinks" POST events to a developer-hosted HTTPS endpoint. Outbound HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No official WebSocket endpoint is documented. An unofficial community library (smart-events) uses undocumented WS endpoints and is not production-ready.
