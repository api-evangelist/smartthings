components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        A Personal Access Token (PAT) from https://account.smartthings.com/tokens
        or an OAuth 2.0 access token, passed as `Authorization: Bearer {token}`.
    oauth2:
      type: oauth2
      description: OAuth 2.0 authorization code flow for production integrations.
      flows:
        authorizationCode:
          authorizationUrl: https://api.smartthings.com/oauth/authorize
          tokenUrl: https://api.smartthings.com/oauth/token
          scopes:
            r:devices:*: Read devices
            x:devices:*: Control devices
            r:locations:*: Read locations
            w:locations:*: Manage locations
            r:scenes:*: Read scenes
            x:scenes:*: Execute scenes
            r:rules:*: Read rules
            w:rules:*: Manage rules
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: The identifier of the device.
      schema:
        type: string
    ComponentId:
      name: componentId
      in: path
      required: true
      description: The identifier of the device component (e.g. main).
      schema:
        type: string
    LocationId:
      name: locationId
      in: path
      required: true
      description: The identifier of the location.
      schema:
        type: string
    InstalledAppId:
      name: installedAppId
      in: path
      required: true
      description: The identifier of the installed app.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: The request violated a platform guardrail or failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        requestId:
          type: string
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: true
    DeviceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        _links:
          type: object
          additionalProperties: true
    Device:
      type: object
      properties:
        deviceId:
          type: string
        name:
          type: string
        label:
          type: string
        locationId:
          type: string
        roomId:
          type: string
        deviceTypeName:
          type: string
        type:
          type: string
        components:
          type: array
          items:
            type: object
            additionalProperties: true
    CommandsRequest:
      type: object
      required:
        - commands
      properties:
        commands:
          type: array
          items:
            type: object
            required:
              - capability
              - command
            properties:
              component:
                type: string
                default: main
              capability:
                type: string
              command:
                type: string
              arguments:
                type: array
                items: {}
    CommandResults:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              status:
                type: string
                enum: [ACCEPTED, COMPLETED, FAILED]
    Location:
      type: object
      properties:
        locationId:
          type: string
        name:
          type: string
        countryCode:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        temperatureScale:
          type: string
        timeZoneId:
          type: string
    LocationInput:
      type: object
      required:
        - name
        - countryCode
      properties:
        name:
          type: string
        countryCode:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        temperatureScale:
          type: string
    Room:
      type: object
      properties:
        roomId:
          type: string
        locationId:
          type: string
        name:
          type: string
    RoomInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    Scene:
      type: object
      properties:
        sceneId:
          type: string
        sceneName:
          type: string
        locationId:
          type: string
    Rule:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        actions:
          type: array
          items:
            type: object
            additionalProperties: true
    Capability:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
        status:
          type: string
        name:
          type: string
        attributes:
          type: object
          additionalProperties: true
        commands:
          type: object
          additionalProperties: true
    InstalledApp:
      type: object
      properties:
        installedAppId:
          type: string
        appId:
          type: string
        installedAppType:
          type: string
        installedAppStatus:
          type: string
        locationId:
          type: string
    Subscription:
      type: object
      properties:
        id:
          type: string
        installedAppId:
          type: string
        sourceType:
          type: string
          enum: [DEVICE, CAPABILITY, MODE, DEVICE_LIFECYCLE, DEVICE_HEALTH, HUB_HEALTH, SCENE_LIFECYCLE, SECURITY_ARM_STATE]
        device:
          type: object
          additionalProperties: true
        capability:
          type: object
          additionalProperties: true
    Schedule:
      type: object
      properties:
        scheduledExecutions:
          type: array
          items:
            type: integer
        name:
          type: string
        cron:
          type: object
          properties:
            expression:
              type: string
            timezone:
              type: string
        once:
          type: object
          properties:
            time:
              type: integer
    App:
      type: object
      properties:
        appId:
          type: string
        appName:
          type: string
        appType:
          type: string
          enum: [LAMBDA_SMART_APP, WEBHOOK_SMART_APP, API_ONLY]
        displayName:
          type: string
        description:
          type: string
        webhookSmartApp:
          type: object
          additionalProperties: true
        lambdaSmartApp:
          type: object
          additionalProperties: true
